<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EcoLife — Student Lifestyle Tracker. Track habits, cut carbon, earn rewards.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EcoLife">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EcoLife — Student Lifestyle Tracker</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Poppins (matches in-app theme) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ─────────────────────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0D1117;
    }

    /* ── Loading screen ───────────────────────────────────────────────── */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0D1117;
      font-family: 'Poppins', sans-serif;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    /* ── Leaf icon container ──────────────────────────────────────────── */
    .leaf-container {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pulsing glow ring behind the leaf */
    .leaf-container::before {
      content: '';
      position: absolute;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29,185,84,0.2) 0%, rgba(29,185,84,0) 70%);
      animation: pulse-glow 2s ease-in-out infinite;
    }

    /* Outer ring */
    .leaf-ring {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid rgba(29,185,84,0.3);
      animation: ring-breathe 2.5s ease-in-out infinite;
    }

    /* Leaf SVG */
    .leaf-icon {
      width: 56px;
      height: 56px;
      animation: leaf-float 3s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(29,185,84,0.4));
      z-index: 1;
    }

    /* ── Orbiting dots ────────────────────────────────────────────────── */
    .orbit {
      position: absolute;
      width: 140px;
      height: 140px;
      animation: orbit-spin 3s linear infinite;
    }

    .orbit-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00F5D4;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 8px rgba(29,185,84,0.6);
    }

    .orbit-dot.dot-2 {
      top: auto;
      bottom: 0;
      background: #2E6EE1;
      box-shadow: 0 0 8px rgba(0,191,165,0.6);
      width: 4px;
      height: 4px;
    }

    .orbit-dot.dot-3 {
      top: 50%;
      left: auto;
      right: 0;
      transform: translateY(-50%);
      background: #DAA520;
      box-shadow: 0 0 8px rgba(255,179,0,0.5);
      width: 5px;
      height: 5px;
    }

    /* ── Brand text ───────────────────────────────────────────────────── */
    .brand-name {
      margin-top: 32px;
      font-size: 28px;
      font-weight: 700;
      color: #E6EDF3;
      letter-spacing: 1px;
      animation: text-reveal 1s ease-out 0.3s both;
    }

    .brand-tagline {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 400;
      color: #8B949E;
      letter-spacing: 0.5px;
      animation: text-reveal 1s ease-out 0.6s both;
    }

    /* ── Progress bar ─────────────────────────────────────────────────── */
    .progress-container {
      margin-top: 40px;
      width: 160px;
      height: 3px;
      background: #1C2128;
      border-radius: 2px;
      overflow: hidden;
      animation: text-reveal 0.6s ease-out 0.9s both;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(90deg, #00F5D4, #2E6EE1);
      box-shadow: 0 0 10px rgba(29,185,84,0.4);
      animation: load-progress 2.5s ease-in-out infinite;
    }

    /* ── Floating particles ───────────────────────────────────────────── */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(29,185,84,0.15);
      animation: float-up linear infinite;
    }

    .particle:nth-child(1) { left: 10%; width: 2px; height: 2px; animation-duration: 8s; animation-delay: 0s; }
    .particle:nth-child(2) { left: 25%; width: 3px; height: 3px; animation-duration: 10s; animation-delay: 1s; }
    .particle:nth-child(3) { left: 40%; width: 2px; height: 2px; animation-duration: 7s; animation-delay: 2s; background: rgba(0,191,165,0.15); }
    .particle:nth-child(4) { left: 55%; width: 4px; height: 4px; animation-duration: 9s; animation-delay: 0.5s; }
    .particle:nth-child(5) { left: 70%; width: 2px; height: 2px; animation-duration: 11s; animation-delay: 3s; background: rgba(0,191,165,0.12); }
    .particle:nth-child(6) { left: 85%; width: 3px; height: 3px; animation-duration: 8s; animation-delay: 1.5s; }
    .particle:nth-child(7) { left: 15%; width: 2px; height: 2px; animation-duration: 12s; animation-delay: 4s; background: rgba(255,179,0,0.1); }
    .particle:nth-child(8) { left: 60%; width: 3px; height: 3px; animation-duration: 9s; animation-delay: 2.5s; }

    /* ── Keyframes ─────────────────────────────────────────────────────── */
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50%      { transform: scale(1.2); opacity: 1; }
    }

    @keyframes ring-breathe {
      0%, 100% { transform: scale(1); opacity: 0.4; }
      50%      { transform: scale(1.08); opacity: 0.8; }
    }

    @keyframes leaf-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25%      { transform: translateY(-6px) rotate(3deg); }
      75%      { transform: translateY(4px) rotate(-2deg); }
    }

    @keyframes orbit-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes text-reveal {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes load-progress {
      0%   { width: 0%; }
      50%  { width: 70%; }
      80%  { width: 90%; }
      100% { width: 100%; }
    }

    @keyframes float-up {
      0%   { transform: translateY(100vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- ── Custom Eco Loading Screen ─────────────────────────────────────── -->
  <div id="loading">
    <!-- Background particles -->
    <div class="particles">
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
      <div class="particle"></div>
    </div>

    <!-- Leaf icon with orbiting dots -->
    <div class="leaf-container">
      <div class="leaf-ring"></div>
      <div class="orbit">
        <div class="orbit-dot"></div>
        <div class="orbit-dot dot-2"></div>
        <div class="orbit-dot dot-3"></div>
      </div>
      <!-- Leaf SVG icon -->
      <svg class="leaf-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 8C8 10 5.9 16.17 3.82 21.34L5.71 22L6.66 19.7C7.14 19.87 7.64 20 8.17 20C12.17 20 15.87 17.04 17.65 13.09C20.34 7.07 20 2 20 2C20 2 18.89 2 17 3C15.11 4 13.5 5.69 12.51 7.43" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="rgba(29,185,84,0.15)"/>
        <path d="M17 8C17 8 15 10 12.51 7.43" stroke="#00F5D4" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M8 16C8 16 10 14 12 14" stroke="#2E6EE1" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <path d="M6 19C6 19 9 16 11 15.5" stroke="#2E6EE1" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
      </svg>
    </div>

    <!-- Brand -->
    <div class="brand-name">EcoLife</div>
    <div class="brand-tagline">Track habits · Cut carbon · Earn rewards</div>

    <!-- Themed progress bar -->
    <div class="progress-container">
      <div class="progress-bar"></div>
    </div>
  </div>

  <!--
    The flutter_bootstrap.js script handles loading Flutter engine.
    We hook into it to fade out our custom loading screen.
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Watch for Flutter to render — once the flutter-view element appears, fade out loading
    var observer = new MutationObserver(function(mutations) {
      for (var m of mutations) {
        for (var node of m.addedNodes) {
          if (node.tagName === 'FLUTTER-VIEW' || node.tagName === 'FLT-GLASS-PANE' || (node.shadowRoot)) {
            var loader = document.getElementById('loading');
            if (loader) {
              loader.classList.add('hidden');
              setTimeout(function() { loader.remove(); }, 700);
            }
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback: hide after 8 seconds no matter what
    setTimeout(function() {
      var loader = document.getElementById('loading');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(function() { loader.remove(); }, 700);
      }
    }, 8000);
  </script>
</body>
</html>
