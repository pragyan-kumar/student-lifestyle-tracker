name: Build Flutter APK

on:
  push:
    branches: [main, master] # Triggers automatically when code is pushed to main or master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code onto the cloud server
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Java (required to compile Android apps)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Set up the Flutter SDK on the server
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # 4. Install dependencies (pub get)
      - name: Install dependencies
        run: flutter pub get

      # 5. Build the final release APK
      - name: Build APK
        run: flutter build apk --release

      # 6. Save the APK so you can download it from GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
